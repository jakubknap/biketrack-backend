services:
  postgres:
    container_name: biketrack-postgres
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: biketrack
    volumes:
      - postgres:/data/postgres
    ports:
      - 5432:5432
    networks:
      - biketrack
    restart: unless-stopped
  mail-dev:
    container_name: biketrack-mail-dev
    image: maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025

networks:
  biketrack:
    driver: bridge

volumes:
  postgres:
    driver: local